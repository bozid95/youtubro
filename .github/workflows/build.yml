name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      # Optional: add these repo secrets to sign releases with your own key, so updates
      # install over each other. KEYSTORE_BASE64 = `base64 -w0 your.jks`
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build debug and release APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      # Asks YouTube Music for real from the runner and prints what came back (never fails the build)
      - name: InnerTube smoke test
        continue-on-error: true
        run: ./gradlew :innertube:testDebugUnitTest --tests '*SmokeTest*' | grep -E "SMOKE|FAILED|BUILD" || true

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/iyou-debug.apk
          cp app/build/outputs/apk/release/*.apk out/iyou-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iyou-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
